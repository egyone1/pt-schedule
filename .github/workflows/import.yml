name: Nightly schedule import

# Every hour from 9 AM to 8 PM Cairo the schedule is created (first run) or brought up to date
# with the sheet; 9 PM is the last read (final schedule); just after midnight old days close.
# Cron is in UTC: Cairo is UTC+3 in summer time and UTC+2 in winter, so the hourly range covers
# both, and the script checks the Cairo hour and does each step only once.
# GitHub often starts scheduled runs late or skips them, so a Google Apps Script timer (on the owner's
# Google account) also starts this workflow every 5 minutes with mode "auto"; the script then decides by
# the Cairo hour what to do and exits in seconds when nothing is due. The crons below are only a backup.
on:
  schedule:
    - cron: "5 6-20 * * *"
    - cron: "35 18,19 * * *"
    - cron: "5 21,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (decide by the hour - used by the timer), open, refresh / final (re-read the sheet) or close"
        required: true
        default: "auto"
        type: choice
        options: [auto, open, refresh, final, close]
      day:
        description: "Day YYYY-MM-DD (empty = today)"
        required: false

permissions:
  contents: read
  actions: write

concurrency:            # never two imports at the same time
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Import today's schedule
        working-directory: importer
        run: python run_import.py
        env:
          SHARE_URL: ${{ secrets.SHARE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          IMPORTER_EMAIL: ${{ secrets.IMPORTER_EMAIL }}
          IMPORTER_PASSWORD: ${{ secrets.IMPORTER_PASSWORD }}
          MODE: ${{ inputs.mode != 'auto' && inputs.mode || '' }}
          DAY: ${{ inputs.day }}
      # GitHub pauses scheduled workflows after 60 days without commits - keep this one on.
      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/import.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
