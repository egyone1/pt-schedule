name: Nightly schedule import

# 9 AM Cairo opens today's schedule, 9 PM Cairo re-reads it as the final version,
# just after midnight Cairo the day before yesterday is closed.
# Cairo is UTC+3 in summer time and UTC+2 in winter, so each time has runs for both;
# the script checks the Cairo hour and only acts inside 9-10 AM / 9-10 PM (and only once).
on:
  schedule:
    - cron: "0 6,7 * * *"
    - cron: "30 6,7 * * *"
    - cron: "0 18,19 * * *"
    - cron: "40 19 * * *"
    - cron: "5 21,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "open (create today's schedule), final (re-read the sheet) or close (close old days)"
        required: true
        default: "open"
        type: choice
        options: [open, final, close]
      day:
        description: "Day YYYY-MM-DD (empty = today)"
        required: false

permissions:
  contents: read
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Import today's schedule
        working-directory: importer
        run: python run_import.py
        env:
          SHARE_URL: ${{ secrets.SHARE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          IMPORTER_EMAIL: ${{ secrets.IMPORTER_EMAIL }}
          IMPORTER_PASSWORD: ${{ secrets.IMPORTER_PASSWORD }}
          MODE: ${{ inputs.mode }}
          DAY: ${{ inputs.day }}
      # GitHub pauses scheduled workflows after 60 days without commits - keep this one on.
      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/import.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
